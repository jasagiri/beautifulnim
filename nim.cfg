# Sources of this package, and Nim's own parser (compiler/), which ships with the compiler.
--path:"src"
--path:"$nim"
# The compiler's VM registers the stdlib's compile-time procs (querySetting and the like) only with
# nimcore; `beautifulnim check --typed` runs that VM (src/beautifulnim/typed.nim).
--define:nimcore
--mm:orc
--styleCheck:usages
--styleCheck:error
# lints/nim.cfg, applied to this package itself.
--warningAsError:InheritFromException:on
--warningAsError:UnusedImport:on
--warning:StdPrefix:on
--warningAsError:StdPrefix:on
--warningAsError:CStringConv:on
--warningAsError:EnumConv:on
--warningAsError:HoleEnumConv:on
--warningAsError:UnsafeDefault:on
--warningAsError:UnsafeSetLen:on
--warningAsError:ResultShadowed:on
--warningAsError:UseBase:on

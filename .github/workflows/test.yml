name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Show the compiler
        run: nim -v
      # E tests (docs/specification.md): rules, the command (with --typed), lints/nim.cfg, guide examples
      - name: nim test
        run: nim test

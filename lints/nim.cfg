# beautifulnim's recommended compiler settings. Copy into a project's nim.cfg (or
# config.nims as switch(...) calls). Each line has a file in check/ that it rejects
# (tests/test_lints.nim, BN-L2). Nim 2.4.2.

# Spell every identifier as it was declared (Nim's style-insensitive matching otherwise
# lets readAll, read_all and readall name the same thing). usages: only your own code.
--styleCheck:usages
--styleCheck:error

# Warnings that point at real bugs. A warning that is off by default is switched on first.
# Not here: BareExcept (except Exception:). std/unittest's own templates trip it, so as an
# error it fails every test file that imports unittest (Nim 2.4.2, unittest.nim line 556).
# The guide still forbids except Exception: (SKILL.md section 5).
--warningAsError:InheritFromException:on   # object of Exception (use CatchableError / Defect)
--warningAsError:UnusedImport:on
--warning:StdPrefix:on
--warningAsError:StdPrefix:on              # import std/os, not import os
--warningAsError:CStringConv:on            # implicit string -> cstring; the cstring does not own the bytes
--warningAsError:EnumConv:on               # one enum converted to another
--warningAsError:HoleEnumConv:on           # conversion to an enum with holes
--warningAsError:UnsafeDefault:on          # default(T) for a type that requires init
--warningAsError:UnsafeSetLen:on           # setLen growing a seq of types that require init
--warningAsError:ResultShadowed:on         # a local named result hides the return value
--warningAsError:UseBase:on                # a base method without {.base.}
